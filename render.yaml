# Compiled Go service with existing persistent Turso storage.
services:
  - type: web
    name: trailmix-production-desk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TRAILMIX_HTTPS
        value: "1"
      - key: TRAILMIX_REQUIRE_ACCESS_CODE
        value: "0"
      - key: TRAILMIX_SAFETY_PIN
        sync: false
      - key: GOMEMLIMIT
        value: "384MiB"
      - key: GOMAXPROCS
        value: "1"
