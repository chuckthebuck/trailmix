# Free Render web service + external free Turso libSQL database.
# Set up Turso first; no local database or paid persistent disk is used.
services:
  - type: web
    name: trailmix-production-desk
    runtime: python
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: python -m py_compile server.py turso_db.py
    startCommand: python -u server.py
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TRAILMIX_HTTPS
        value: "1"
      - key: TRAILMIX_REQUIRE_ACCESS_CODE
        value: "0"
      - key: TRAILMIX_SAFETY_PIN
        sync: false
