name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  production-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compiled backend, migration and browser checks
        run: python3 run_checks.py
